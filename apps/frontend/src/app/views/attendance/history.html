<!-- Attendance History (Aurora Slate Theme) -->

<div ng-if="!vm.isLoading" style="padding-top: 24px;">
    <div class="dash-wrap">
        <div class="dash-hero">
            <div class="dash-hero-left">
                <div class="dash-avatar" style="background: linear-gradient(135deg, #3B82F6, #1E40AF); color: #fff;">
                    <i class="fas fa-history"></i>
                </div>
                <div>
                    <h2>Attendance History</h2>
                    <p>Track participation records across all sessions.</p>
                </div>
            </div>
        </div>

        <div class="dash-card" style="padding: 0; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--dash-border); background: rgba(255, 255, 255, 0.02);">
                        <th style="padding: 12px 16px; color: var(--dash-dim); font-weight: 700; font-size: 0.75rem; text-transform: uppercase;">Date</th>
                        <th style="padding: 12px 16px; color: var(--dash-dim); font-weight: 700; font-size: 0.75rem; text-transform: uppercase;">Student</th>
                        <th style="padding: 12px 16px; color: var(--dash-dim); font-weight: 700; font-size: 0.75rem; text-transform: uppercase;">Session</th>
                        <th style="padding: 12px 16px; color: var(--dash-dim); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; text-align: center;">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="record in vm.history" style="border-bottom: 1px solid var(--dash-border);">
                        <td style="padding: 16px; color: var(--dash-text);">{{ vm.formatDate(record.markedAt) }}</td>
                        <td style="padding: 16px;">
                            <div style="font-weight: 700; color: var(--dash-text);">{{ record.studentId.userId.name }}</div>
                        </td>
                        <td style="padding: 16px;">
                            <div style="font-size: 0.85rem; color: var(--dash-muted);">{{ record.sessionId.offeringId.courseId.code }}</div>
                        </td>
                        <td style="padding: 16px; text-align: center;">
                            <span class="chip" ng-class="'status-' + record.status">{{ record.status }}</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
