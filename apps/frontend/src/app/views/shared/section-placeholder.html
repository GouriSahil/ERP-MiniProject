<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <div class="card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;">
                <div class="card-body p-4">
                    <h3 style="color: var(--text-primary); font-weight: 700; margin-bottom: 0.75rem;">
                        <i class="{{ navigation.section.icon }}" style="color: var(--accent-color); margin-right: 0.5rem;"></i>
                        {{ navigation.section.title }}
                    </h3>
                    <p style="color: var(--text-secondary); margin-bottom: 0;">
                        Navigation item is ready. The {{ navigation.section.title }} module UI will be added in the next frontend tasks.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
