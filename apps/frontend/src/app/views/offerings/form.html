<!-- Course Offering Form (Aurora Slate Theme) -->

<div class="dash-wrap" style="padding-top: 24px; max-width: 800px; margin: 0 auto;">
    
    <!-- Hero / Header -->
    <div class="dash-hero" style="margin-bottom: 24px;">
        <div class="dash-hero-left">
            <a href="#!/course-offerings" class="btn-mini" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h2>{{vm.offering.courseId ? 'Edit' : 'New'}} Course Offering</h2>
                <p>Configure a course for a specific term with schedule and capacity.</p>
            </div>
        </div>
    </div>

    <!-- Main Form Card -->
    <div class="dash-card">
        <div class="dash-card-body">
            
            <div class="dash-loading" ng-if="vm.isLoading">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>

            <div class="dash-alert dash-alert-danger" ng-if="vm.error && !vm.isLoading">
                <i class="fas fa-exclamation-circle"></i>
                <div>
                    <strong>Error:</strong> {{vm.error}}
                </div>
            </div>

            <form ng-submit="vm.save()" name="offeringForm" novalidate ng-if="!vm.isLoading">
                
                <div class="row">
                    <!-- Course Selection -->
                    <div class="col-md-6" style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Course</label>
                        <select ng-model="vm.offering.courseId" required name="course"
                                style="width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                            <option value="">Select Course</option>
                            <option ng-repeat="c in vm.courses" value="{{ c._id }}">{{ c.code }} - {{ c.name }}</option>
                        </select>
                        <div ng-show="offeringForm.course.$touched && offeringForm.course.$invalid" style="color: #ef4444; font-size: 0.8rem; margin-top: 4px;">Course is required.</div>
                    </div>

                    <!-- Term Selection -->
                    <div class="col-md-6" style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Term</label>
                        <select ng-model="vm.offering.termId" required name="term"
                                style="width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                            <option value="">Select Term</option>
                            <option ng-repeat="t in vm.terms" value="{{ t._id }}">{{ t.name }} ({{ t.year }})</option>
                        </select>
                        <div ng-show="offeringForm.term.$touched && offeringForm.term.$invalid" style="color: #ef4444; font-size: 0.8rem; margin-top: 4px;">Term is required.</div>
                    </div>
                </div>

                <div class="row">
                    <!-- Capacity -->
                    <div class="col-md-6" style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Max Capacity</label>
                        <input type="number" ng-model="vm.offering.maxCapacity" required name="capacity" min="1" max="500"
                               style="width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                        <div ng-show="offeringForm.capacity.$touched && offeringForm.capacity.$invalid" style="color: #ef4444; font-size: 0.8rem; margin-top: 4px;">Valid capacity is required (1-500).</div>
                    </div>

                    <!-- Status -->
                    <div class="col-md-6" style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Status</label>
                        <select ng-model="vm.offering.status" required
                                style="width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                            <option value="active">Active</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>

                <!-- Schedule Section -->
                <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--dash-border); border-radius: 16px; padding: 24px; margin-bottom: 32px;">
                    <h4 style="margin: 0 0 16px; color: var(--dash-text); font-weight: 600; font-size: 1.1rem;">Schedule Configuration</h4>
                    
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 12px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Days of Week</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <button type="button" ng-repeat="day in vm.daysOfWeek" 
                                    ng-click="vm.toggleDay(day)"
                                    style="padding: 8px 16px; border-radius: 8px; border: 1px solid; font-size: 0.9rem; transition: all 0.2s;"
                                    ng-style="vm.offering.schedule.days.indexOf(day) > -1 ? {'background': 'rgba(124, 58, 237, 0.2)', 'border-color': 'rgba(124, 58, 237, 0.5)', 'color': '#c4b5fd'} : {'background': 'transparent', 'border-color': 'var(--dash-border)', 'color': 'var(--dash-dim)'}">
                                {{day}}
                            </button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4" style="margin-bottom: 16px;">
                            <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Start Time</label>
                            <input type="time" ng-model="vm.offering.schedule.startTime" placeholder="HH:MM"
                                   style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                        </div>
                        <div class="col-md-4" style="margin-bottom: 16px;">
                            <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">End Time</label>
                            <input type="time" ng-model="vm.offering.schedule.endTime" placeholder="HH:MM"
                                   style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                        </div>
                        <div class="col-md-4" style="margin-bottom: 16px;">
                            <label style="display: block; margin-bottom: 8px; color: var(--dash-dim); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Room / Location</label>
                            <input type="text" ng-model="vm.offering.room" placeholder="e.g. Room 101"
                                   style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--dash-border); border-radius: 12px; color: var(--dash-text); outline: none;">
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--dash-border);">
                    <button type="button" class="btn-mini" style="padding: 10px 24px;" ng-click="vm.navigateBack()">Cancel</button>
                    <button type="submit" class="dash-btn-primary" style="padding: 10px 32px;" ng-disabled="vm.isSaving">
                        <i class="fas fa-spinner fa-spin" ng-if="vm.isSaving" style="margin-right: 8px;"></i>
                        Save Course Offering
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
